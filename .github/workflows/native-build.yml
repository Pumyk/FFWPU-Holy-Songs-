          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in native/app/build/outputs/apk/debug/app-debug.apk \
            -out HPHC-preview.apk.cms /tmp/hphc-preview-transport.crt

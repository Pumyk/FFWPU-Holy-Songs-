name: Build native app (Compose)
on:
  workflow_dispatch:
  push:
    branches: [preview/pdf-news]
    paths: ['native/**', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/preview/pdf-news'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build test APK
        working-directory: native
        run: gradle assembleDebug --no-daemon
      - name: Encrypt the APK for private delivery
        shell: bash
        run: |
          cat > /tmp/hphc-preview-transport.crt <<'CERT'
          -----BEGIN CERTIFICATE-----

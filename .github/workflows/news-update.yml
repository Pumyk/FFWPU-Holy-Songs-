name: HJ Global News refresh

# Refreshes the English HJ Global News digest every Saturday night, Nigerian
# time (23:30 WAT = 22:30 UTC), plus manual dispatch support.
on:
  schedule:
    - cron: "30 22 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest English editions
        run: python scripts/update_news.py
      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh HJ Global News digest"
          git push
